name: Tada

options:
  bundleIdPrefix: com.tada
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Shared by every target so test bundles and the host app sign with the
    # same Team ID — required for the hardened-runtime app to load test bundles.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: HKQARCV8QZ

targets:
  Tada:
    type: application
    platform: macOS
    sources:
      - Tada/Sources
      - Tada/Resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tada
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.tada.app
        ENABLE_HARDENED_RUNTIME: YES
        # Marketing version is kept here and bumped by hand on releases.
        # Build number (CFBundleVersion) is set automatically at build time
        # by the "Set build number from git" script below.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configurations:
        Debug:
          debugInformationFormat: dwarf
        Release:
          enablesTesting: YES
    postBuildScripts:
      - name: Set build number from git
        basedOnDependencyAnalysis: false
        script: |
          # Stamp CFBundleVersion with the branch's commit count so every
          # build gets a unique, monotonically increasing build number.
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          build_number=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null)
          if [ -z "$build_number" ]; then
            echo "warning: not a git checkout — leaving CFBundleVersion unchanged"
            exit 0
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build_number" "$plist"
          echo "CFBundleVersion set to $build_number"

  TadaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TadaTests
    dependencies:
      - target: Tada
    settings:
      base:
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES
      configurations:
        Debug:
          debugInformationFormat: dwarf

  TadaIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TadaIntegrationTests
    dependencies:
      - target: Tada
    settings:
      base:
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES
      configurations:
        Debug:
          debugInformationFormat: dwarf

  TadaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/TadaUITests
    dependencies:
      - target: Tada
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tada
        PRODUCT_BUNDLE_IDENTIFIER: com.tada.app.UITests

schemes:
  Tada:
    build:
      targets:
        Tada: all

  TadaTests:
    build:
      targets:
        Tada: all
        TadaTests: test
    test:
      targets:
        - name: TadaTests

  TadaIntegrationTests:
    build:
      targets:
        Tada: all
        TadaIntegrationTests: test
    test:
      targets:
        - name: TadaIntegrationTests

  TadaUITests:
    build:
      targets:
        Tada: all
        TadaUITests: test
    test:
      targets:
        - name: TadaUITests
