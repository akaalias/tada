<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment lineage — automatic vs. mined</title>
<link rel="stylesheet" href="tufte.css">
<style>
html,body{overflow-x:hidden;}   /* the full-bleed timeline is 100vw; stop it adding a page-wide scrollbar */
.lin-wrap{max-width:1100px;margin:0 auto;padding:36px 24px 80px;}
h1{font-size:30px;margin:0 0 6px;}
.sub{font:400 18px/1.4 var(--serif);color:var(--muted);margin:0 0 18px;}
.lin-stats{display:flex;flex-wrap:wrap;gap:10px 26px;font-size:14px;color:var(--muted);
           border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;margin:14px 0 6px;}
.lin-stats b{color:var(--ink);font-variant-numeric:tabular-nums;}
.lin-legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px;color:var(--muted);margin:10px 0 6px;}
.lin-legend span{display:inline-flex;align-items:center;gap:6px;}
.lin-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}
.lin-legend i.line{width:20px;height:0;border-radius:0;border-top:2px solid var(--muted);}
.diffs{font-size:14px;line-height:1.6;color:#33312b;margin:14px 0 0;}
.diffs h3{font:600 13px/1 var(--serif);font-feature-settings:"smcp" 1;text-transform:uppercase;
          letter-spacing:.05em;color:var(--muted);margin:18px 0 6px;}
.diffs li{margin:4px 0;}
.diffs code{font:12.5px var(--mono);color:var(--ink);background:#f2eedd;padding:0 4px;border-radius:3px;}
.col-head-l,.col-head-r{font:600 12px/1 var(--serif);font-feature-settings:"smcp" 1;text-transform:uppercase;
          letter-spacing:.05em;color:var(--muted);}
/* full-bleed: break the timeline out of the reading column to the full viewport */
#diagram{overflow-x:auto;padding:0 24px 8px;box-sizing:border-box;width:100vw;margin-left:calc(50% - 50vw);
         scrollbar-width:thin;scrollbar-color:var(--rule) transparent;}
#diagram::-webkit-scrollbar{height:3px;-webkit-appearance:none;}
#diagram::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px;}
#diagram::-webkit-scrollbar-track{background:transparent;}
#diagram svg text{font-family:var(--serif);}
#tip{position:fixed;pointer-events:none;background:var(--paper);color:var(--ink);
     font:13px/1.45 var(--serif);padding:9px 13px;border:1px solid var(--rule);border-radius:5px;
     box-shadow:0 4px 18px rgba(60,50,30,.15);max-width:640px;opacity:0;transition:opacity .1s;z-index:10;}
#tip .pop-title{font-weight:700;font-size:13.5px;line-height:1.4;margin-bottom:8px;}
#tip .pop-grid{display:flex;gap:18px;align-items:flex-start;}
#tip .pop-diagram{flex:0 0 auto;}
#tip .pop-diagram svg{display:block;}
#tip .pop-body{flex:1 1 auto;min-width:240px;max-width:400px;}
#tip .pop-sec{margin-top:9px;}
#tip .pop-sec:first-child{margin-top:0;}
#tip .pop-h{font:800 10.5px/1 var(--serif);font-feature-settings:"smcp" 1;text-transform:uppercase;
            letter-spacing:.05em;margin-bottom:3px;}
#tip .pop-h.hyp{color:var(--muted);} #tip .pop-h.tech{color:var(--ochre);} #tip .pop-h.res{color:var(--ink);}
#tip .pop-sec p{margin:0;font-size:12.5px;line-height:1.5;color:#33312b;}
#tip .tt-title{font-weight:700;}
#tip .tt-title .ar{color:var(--faint);font-weight:400;margin:0 2px;}
#tip .tt-title .star{color:var(--ochre);}
#tip .tt-meta{color:var(--muted);font-size:12px;margin-top:2px;}
#tip .tt-ev{color:var(--ochre);font-style:italic;font-size:12px;margin-top:5px;line-height:1.4;
            border-top:1px solid var(--rule-soft);padding-top:5px;}
.warn{color:var(--accent);}
</style>
</head>
<body>
<div class="lin-wrap">
  <h1>Experiment lineage</h1>
  <p class="sub">The 76 experiments left→right in run order (scroll sideways). Each arc links a run to a parent it built on — mined from <code>program.md</code> and the pipeline specs. <b>Hover a run</b> to isolate just its parents and children.</p>
  <div class="nav">
    <a href="index.html">Live dashboard</a>
    <a href="onboarding.html">Project overview</a>
    <a href="report.html">Final report</a>
  </div>
  <div class="lin-legend" id="legend"></div>
  <div id="diagram"></div>
  <div class="diffs" id="notes"></div>
</div>
<div id="tip"></div>
<script src="d3.v7.min.js"></script>
<script type="module" src="js/lineage.js"></script>
</body>
</html>
